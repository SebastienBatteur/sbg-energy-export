# SPDX-License-Identifier: Apache-2.0
# Tests (pytest-homeassistant-custom-component, vrai recorder SQLite en mémoire) et ruff.
name: Tests

# Dépôt public : ces minutes ne sont pas décomptées du quota du compte. Réglages du 28/10/2026
# quand même (sobriété) : rien pour la documentation seule, annulation de l'exécution devenue
# inutile sur une branche ou une PR, timeouts. Les pushs de toutes les branches restent testés
# (gratuit ici, et une branche sans PR garde sa CI).
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# Sur main, un groupe par exécution (run_id) : GitHub ne garde qu'une exécution en attente par
# groupe, et un push ne doit pas remplacer la validation nocturne en attente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q
